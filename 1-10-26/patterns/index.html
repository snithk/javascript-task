<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patterns</title>
<style>
    body {
        font-family: sans-serif;
        padding: 20px;
    }
    h1{
        text-align: center;
        color: #000;
    }
    button {
        margin: 4px;
        padding: 6px 12px;
        cursor: pointer;
        color: #fff;
        width: 200px;
        height: auto;
        border-radius: 4px;
        background-color: black;
    }
    div{
        display: flex;
        justify-content: center;
        flex-wrap: wrap;

        align-items: center;
    }
    #result {
        display: none;
        margin-top: 20px;
        padding: 15px;
        width: 100%;
        text-align: center;
        font-size: 30px;
        background: #111;
        color: #fff;
        font-family: "Courier New", monospace;
        font-size: 16px;
        white-space: pre;
        line-height: 1.2;
        border-radius: 6px;
    }
</style>
</head>
<body>
    <h1>Pattern Printing</h1>
    <div>
    <button onclick="printPattern1()">Pattern 1</button>
    <button onclick="printPattern2()">Pattern 2</button>
    <button onclick="printPattern3()">Pattern 3</button>
    <button onclick="printPattern4()">Pattern 4</button>
    <button onclick="printPattern5()">Pattern 5</button>
    <button onclick="printPattern6()">Pattern 6</button>
    <button onclick="printPattern7()">Pattern 7</button>
    <button onclick="printPattern8()">Pattern 8</button>
    <button onclick="printPattern9()">Pattern 9</button>
    <button onclick="printPattern10()">Pattern 10</button>
    <button onclick="printPattern11()">Pattern 11</button>
    <button onclick="printPattern12()">Pattern 12</button>
    <button onclick="printPattern13()">Pattern 13</button>
    <button onclick="printPattern14()">Pattern 14</button>
    </div>

    <pre id="result"></pre>

    <script  type="text/javascript" src="patterns.js"></script>
   
</body>
</html>
